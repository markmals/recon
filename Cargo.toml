[workspace]
resolver = "3"
members = [
    "crates/recon",
    "crates/recon-accessibility-macos",
    "crates/recon-applications-macos",
    "crates/recon-core",
    "crates/recon-native-access-macos",
    "crates/recon-privacy-macos",
    "crates/recon-ui-guard-macos",
    "crates/recon-window-server-macos",
]

[workspace.package]
# Changesets owns this version: `mise run version` copies it here from package.json
# (tools/sync-version.ts), and `node tools/sync-version.ts --check` fails CI when the
# two drift. Never edit it by hand.
version = "0.1.3"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/markmals/recon"
rust-version = "1.99"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
