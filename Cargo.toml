[workspace]
resolver = "3"
members = ["crates/recon"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/markmals/recon"
rust-version = "1.99"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
