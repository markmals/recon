#:schema https://mise.jdx.dev/schema/mise.json
# mise owns the task graph. Every other tool is invoked from a task here, so the
# local gate and the CI gate cannot drift apart.
#
# `secrets` on a task is rejected by mise < 2026.10.4.
min_version = "2026.10.4"

[settings]
# Required for `[secrets.fnox]` task grants.
# A global or local-only setting does not travel to CI, so it is committed here.
experimental = true
# Keep mise.lock current as tools change; `mise lock --platform …` regenerates it.
lockfile = true

[tools]
# hk's version must match the `amends`/`import` URLs in hk.pkl — bump both together.
hk = "2.8.1"
fnox = "1.42.1"
"1password" = "2.41.1" # provides `op`, the 1Password CLI fnox shells out to
gh = "2.103.2"
actionlint = "1.7.12"
node = "26.12.1" # 26 or newer: every tools/*.ts runs on native type stripping
pnpm = "12.15.0" # matches `packageManager` in package.json; keep the two in step
worktrunk = "0.81.0" # provides `wt`
# Beads is not in the mise registry; the GitHub release backend installs the same
# binary `brew install beads` does. Pin it: an older `bd` refuses to open a newer DB.
"github:gastownhall/beads" = "1.3.2" # provides `bd`
# rustup ships clippy and rustfmt as components of the toolchain, so pinning them
# here is what makes `cargo fmt` and `cargo clippy` work on a fresh clone. `minimal`
# leaves out the offline docs, which nothing in this repository reads.
#
# `rust-toolchain.toml` pins the same version for rustup, which is what the Homebrew
# formula's source build and rust-analyzer use — they never go through mise. Change
# both together.
rust = { version = "1.99.0", profile = "minimal", components = "clippy,rustfmt" }

[env]
# Locally installed CLIs — oxfmt, oxlint, tsrs, vitepress, changeset — without a
# `pnpm exec` prefix. They are devDependencies, never global installs.
_.path = ["{{config_root}}/node_modules/.bin"]
RUST_BACKTRACE = "1"
# Cargo turns colour off when it is not writing to a terminal, which hides it from
# task output and CI logs alike.
CARGO_TERM_COLOR = "always"

# Secrets are resolved by fnox and granted per task with `secrets = [...]`.
# Never list a secret in `[env]` — that would export it to every process.
# This block must exist: without it `mise tasks validate` rejects a grant.
[secrets.fnox]
# profile = "dev"

# ── The uniform surface ──────────────────────────────────────────────────────

[tasks.setup]
description = "Idempotent first-run bootstrap: dependencies, work tracker, git hooks"
depends = ["deps:install"]
run = [
    # Clones the work graph from `refs/dolt/data` on origin in a fresh clone, and does
    # nothing where a database already exists; linked worktrees share the main checkout's.
    # Unlike `bd init`, it neither installs hooks nor writes agent-instruction files.
    "bd bootstrap --yes",
    # bd warns on every command while .beads is group- or world-readable, and a clone
    # creates it 0755. After bootstrap, which creates it when a checkout lacks it.
    "chmod 700 .beads",
    # hk owns every git hook, beads included (see hk.pkl). Never run `bd hooks install`.
    "hk install --mise",
]

[tasks.check]
description = "The single blocking gate: formatting, lint, types, tests, records, docs"
alias = "c"
# `hk check --all` runs every step in hk.pkl: whitespace, newlines, merge conflicts,
# actionlint, Oxfmt, Oxlint, the `tsrs` step (which calls `mise run typecheck`), and
# `cargo fmt --all --check` and `cargo clippy … -D warnings`. Formatting, linting and
# type checking are therefore already in this gate — adding them to `depends` would
# only run them twice. If you remove a step from hk.pkl, add it back here.
#
# `docs:build` is the documentation site that renders the project record, and it is
# the only check that catches a dead link between records.
#
# The native-inspection tasks below are deliberately absent: each one observes a live
# Mac — the signing keychain, a built app bundle, a running fixture — so they cannot
# run on a Linux runner or on a machine without the privacy grants. Run them on a
# macOS host before claiming native behaviour works.
depends = ["crates", "test", "doc"]
run = ["hk check --all", "mise run validate", "mise run docs:build"]

[tasks.validate]
description = "Check proposals, policies, decisions and guides against the record rules"
run = "node tools/validate.ts"

[tasks.status]
description = "Where the work stands: current phase, next action, who acts"
run = "node tools/status.ts"

[tasks.test]
alias = "t"
description = "Run every test that does not need a live Mac: the record tools and the Rust workspace"
# The glob form, not `node --test tools/`: it names exactly what runs and does not
# depend on the runner's directory-discovery rules.
run = ["node --test 'tools/**/*.test.ts'", "cargo test --workspace"]

[tasks.fmt]
alias = "f"
description = "Format with Oxfmt and rustfmt; accepts file paths"
# One task for both languages, because `.omp/extensions/format-after-edit.ts` calls it
# with whatever files an edit touched and cannot know which formatter owns them.
run = "node tools/fmt.ts"

[tasks.lint]
alias = "l"
description = "Lint with Oxlint (type-aware) and Clippy, applying the safe fixes"
run = ["oxlint --fix", "cargo clippy --workspace --all-targets -- -D warnings"]

[tasks.typecheck]
description = "Typecheck with tsrs (the Rust port of tsc 7)"
# Two projects, because they hold their sources to different rules: `tools/*.ts` is run by
# `node --test` through type stripping and so must stay erasable, while `docs/.vitepress/*.ts`
# is compiled by Vite.
run = ["tsrs", "tsrs -p tools/tsconfig.json"]

[tasks.doc]
description = "Build the rustdoc for this workspace; any warning is an error"
# A broken intra-doc link is a broken doc. RUSTDOCFLAGS only reaches rustdoc, so it
# lives on the task rather than in the shared `[env]`.
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps"

[tasks.crates]
description = "Every directory under crates/ is a registered workspace member"
run = "node tools/check-crates.ts"

[tasks.changeset]
description = "Describe this change for the changelog (`mise run changeset -- --empty` when nothing releasable changed)"
run = "changeset add"

[tasks.version]
description = "Apply pending changesets: bump package.json, write CHANGELOG.md, sync the Cargo workspace version"
run = ["changeset version", "node tools/sync-version.ts"]

[tasks."deps:install"]
description = "Install npm dependencies with the pinned pnpm"
run = "pnpm install --frozen-lockfile"

# ── Rust ─────────────────────────────────────────────────────────────────────

[tasks.build]
alias = "b"
description = "Build every crate and target"
run = "cargo build --workspace --all-targets"

[tasks."build:release"]
description = "Build the optimised `recon` executable for this machine"
run = "cargo build --release -p recon"

[tasks.dev]
alias = "d"
description = "Run the CLI from source: `mise run dev -- observe --help`"
run = "cargo run -p recon --"

# ── The documentation site ───────────────────────────────────────────────────

[tasks."docs:dev"]
description = "Serve the documentation site with hot reload"
run = "vitepress dev docs"

[tasks."docs:build"]
description = "Build the documentation site into docs/.vitepress/dist"
# DOCS_BASE sets the site's base path; GitHub Pages and the pull-request previews
# both serve from a subdirectory, so the workflows set it and a local build does not.
run = "vitepress build docs"

[tasks."docs:preview"]
description = "Serve the built documentation site locally"
depends = ["docs:build"]
run = "vitepress preview docs"

# ── Native inspection: these observe a live Mac ──────────────────────────────
#
# Every task below needs macOS, and most need more than that: a signing identity in
# the login keychain, a built fixture app, or the Accessibility and Screen Recording
# grants an authorized research host carries. None of them is in `mise run check`.

[tasks."fixture:build"]
description = "Build the ReconFixture app bundle the UI tests observe"
run = "node tools/build-fixture.ts"

[tasks."fixture:inject"]
description = "Build the fixture variant used by the loader injection tests"
run = "node tools/build-inject-fixture.ts"

[tasks."helper:build"]
description = "Build the universal recon-helper dylib and its build identity"
run = "node tools/build-helper.ts"

[tasks."loader:build"]
description = "Build the recon-loader executable"
run = "node tools/build-loader.ts"

[tasks."recon:sign"]
description = "Code-sign the debug `recon` build with RECON_SIGNING_IDENTITY"
run = "node tools/sign-recon.ts"

[tasks."test:ui"]
description = "UI observation against the live fixture (macOS, signed, granted host)"
depends = ["fixture:build", "recon:sign"]
run = "cargo test -p recon --test ui_observation -- --ignored --test-threads=1"

[tasks."test:focus"]
description = "The no-focus evidence: a continuous out-of-process watch over a live run"
# It activates nothing itself, so run it hands-off.
depends = ["fixture:build", "recon:sign"]
run = "cargo test -p recon --test ui_focus reading_ -- --ignored --test-threads=1"

[tasks."test:inject"]
description = "Loader injection against the inject fixture"
depends = ["fixture:inject", "loader:build"]
run = "node tools/test-inject.ts"

[tasks."test:helper"]
description = "The helper dylib's own test suite"
depends = ["helper:build"]
run = "node tools/test-helper.ts"

[tasks."test:inspection"]
description = "Native inspection end to end: loader, helper, and AppKit facets"
depends = ["fixture:build", "fixture:inject", "helper:build", "loader:build"]
run = "cargo test -p recon --test inspection_live --test inspection_appkit -- --ignored --test-threads=1"
