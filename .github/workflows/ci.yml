name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    # `mise run check` is the one definition of the blocking gate. The pre-push hook
    # runs the same task, so the local gate and this one cannot drift apart.
    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            # mise-action caches only mise's data directory, so a restore can bring
            # back mise's "rust is installed" marker without the rustup toolchain
            # behind it. rust-cache covers the part that is actually slow.
            - uses: jdx/mise-action@v5
              with:
                  cache: false
            - uses: Swatinem/rust-cache@v2.9.3
            # Oxfmt, Oxlint, tsrs and VitePress are devDependencies, so `check` needs them.
            - run: mise run deps:install
            - run: mise run check

    commits:
        name: Commit messages
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: jdx/mise-action@v5
              with:
                  cache: false
            - name: Validate pull request commit messages
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: node tools/check-pr-commits.ts "$BASE_SHA" "$HEAD_SHA"

    # The release pull request consumes changesets instead of adding one, so it is exempt.
    changeset:
        name: Changeset
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: jdx/mise-action@v5
              with:
                  cache: false
            - run: mise run deps:install
            - name: Require a changeset
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: node tools/require-changeset.ts "$BASE_SHA" "$HEAD_SHA"

    version-sync:
        name: Cargo version matches package.json
        # Changesets owns the version and `mise run version` copies it into Cargo.toml.
        # This fails when someone edited one of the two by hand.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: jdx/mise-action@v5
              with:
                  cache: false
            - run: node tools/sync-version.ts --check

    # The preview artifact named in every proposal: an installable macOS executable
    # plus the fixture app a reviewer exercises it against. It also proves the gate
    # passes on the platform Recon actually runs on, not only on the Linux runner.
    macos-preview:
        name: macOS preview artifact
        runs-on: macos-15
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: jdx/mise-action@v5
              with:
                  cache: false
            - uses: Swatinem/rust-cache@v2.9.3
              with:
                  key: macos-15
            - run: mise run deps:install
            - run: mise run check
            - run: mise run build:release
            - run: mise run fixture:build
            - name: Assemble the preview artifact
              run: |
                  mkdir -p dist
                  cp target/release/recon dist/recon
                  ditto target/fixtures/ReconFixture.app dist/ReconFixture.app
                  tar -czf recon-macos-arm64.tar.gz -C dist recon ReconFixture.app
            - uses: actions/upload-artifact@v4
              with:
                  name: recon-macos-arm64
                  path: recon-macos-arm64.tar.gz
                  retention-days: 7
