[package]
name = "recon-native-access-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
recon-applications-macos = { path = "../recon-applications-macos" }
recon-core = { path = "../recon-core" }
recon-window-server-macos = { path = "../recon-window-server-macos" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-foundation = { version = "0.3", features = [
    "CFArray",
    "CFCGTypes",
    "CFDictionary",
    "CFNumber",
    "CFString",
], default-features = false }
objc2-core-graphics = { version = "0.3", features = ["CGWindow"], default-features = false }
