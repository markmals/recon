[package]
name = "recon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2"
objc2-app-kit = { version = "0.3", features = [
    "NSRunningApplication",
    "NSWorkspace",
    "block2",
    "libc",
], default-features = false }
objc2-application-services = { version = "0.3", features = [
    "AXError",
    "AXUIElement",
    "AXValue",
    "HIServices",
    "libc",
    "std",
], default-features = false }
objc2-core-foundation = { version = "0.3", features = [
    "CFArray",
    "CFCGTypes",
    "CFData",
    "CFDictionary",
    "CFNumber",
    "CFString",
    "std",
], default-features = false }
objc2-core-graphics = { version = "0.3", features = [
    "CGDataProvider",
    "CGGeometry",
    "CGImage",
    "CGWindow",
    "std",
], default-features = false }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSError",
    "NSFileManager",
    "NSEnumerator",
    "NSString",
    "NSURL",
], default-features = false }
objc2-image-io = { version = "0.3", features = [
    "CGImageDestination",
    "objc2-core-graphics",
    "std",
], default-features = false }
plist = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3", features = [
    "NSEvent",
    "NSRunningApplication",
    "NSWorkspace",
    "objc2-core-foundation",
], default-features = false }
objc2-core-foundation = { version = "0.3", features = [
    "CFArray",
    "CFDate",
    "CFDictionary",
    "CFNumber",
    "CFRunLoop",
], default-features = false }
objc2-core-graphics = { version = "0.3", features = [
    "CGDirectDisplay",
    "CGWindow",
], default-features = false }
