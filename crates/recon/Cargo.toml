[package]
name = "recon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[lints]
workspace = true

[build-dependencies]
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }

[dependencies]
clap = { version = "4", features = ["string"] }
recon-accessibility-macos = { path = "../recon-accessibility-macos" }
recon-applications-macos = { path = "../recon-applications-macos" }
recon-core = { path = "../recon-core" }
recon-native-access-macos = { path = "../recon-native-access-macos" }
recon-privacy-macos = { path = "../recon-privacy-macos" }
recon-window-server-macos = { path = "../recon-window-server-macos" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSProcessInfo"], default-features = false }
recon-ui-guard-macos = { path = "../recon-ui-guard-macos" }

[dev-dependencies]
jsonschema = { version = "0.46", default-features = false }
proptest = "1"
tempfile = "3"
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3", features = [
    "NSEvent",
    "NSRunningApplication",
    "NSWorkspace",
    "objc2-core-foundation",
], default-features = false }
objc2-core-foundation = { version = "0.3", features = [
    "CFArray",
    "CFDate",
    "CFDictionary",
    "CFNumber",
    "CFRunLoop",
], default-features = false }
objc2-core-graphics = { version = "0.3", features = [
    "CGDirectDisplay",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGWindow",
], default-features = false }
