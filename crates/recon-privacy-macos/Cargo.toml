[package]
name = "recon-privacy-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
recon-core = { path = "../recon-core" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-application-services = { version = "0.3", features = [
    "AXUIElement",
    "HIServices",
    "std",
], default-features = false }
objc2-core-foundation = { version = "0.3", features = [
    "CFData",
    "CFDictionary",
    "CFNumber",
    "CFString",
    "std",
], default-features = false }
objc2-core-graphics = { version = "0.3", features = ["CGWindow", "std"], default-features = false }
objc2-security = { version = "0.3", default-features = false, features = [
    "CSCommon",
    "SecBase",
    "SecCode",
    "std",
] }

[dev-dependencies]
jsonschema = { version = "0.46", default-features = false }
